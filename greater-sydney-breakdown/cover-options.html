<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cover options</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;background:#0A1014;font-family:Montserrat,-apple-system,Segoe UI,Roboto,sans-serif;color:#E8EEF2;padding:18px}
h3{margin:26px 0 8px;font-size:15px;letter-spacing:.08em;text-transform:uppercase;color:#8FA9B4}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:22px}
.sl{position:relative;aspect-ratio:16/9;border-radius:10px;overflow:hidden;container-type:inline-size;
 background:radial-gradient(115% 85% at 12% 14%,#1E525E 0%,#16303A 48%,#0F1A20 100%)}
.pad{position:absolute;inset:0;padding:6cqw 4cqw;display:flex;flex-direction:column;justify-content:center}
.pad h1{font-size:5.2cqw;margin:0;font-weight:800;letter-spacing:-.01em;text-transform:uppercase}
.pad .sub{font-size:2.4cqw;color:#9FD3DE;margin:.6cqw 0 2.6cqw;font-weight:400}
.drow{font-size:1.9cqw;font-weight:700;margin:.85cqw 0;display:flex;align-items:center;gap:.9cqw}
.drow i{width:1.2cqw;height:1.2cqw;border-radius:.25cqw;display:inline-block}
.drow em{font-style:normal;font-weight:400;color:#93A3AD;font-size:1.5cqw;margin-left:.4cqw}
svg.map{position:absolute;pointer-events:none}
.tag{position:absolute;left:0;top:0;background:#0A1014C0;color:#CFE3EA;font-size:12px;font-weight:700;
 padding:6px 12px;border-radius:0 0 10px 0;letter-spacing:.06em;z-index:5}
/* A: district colours */
.va svg.map{right:-3cqw;top:50%;transform:translateY(-50%);width:47cqw;
 -webkit-mask-image:linear-gradient(100deg,transparent 4%,#000 38%);mask-image:linear-gradient(100deg,transparent 4%,#000 38%)}
/* B: etched line-work */
.vb svg.map{right:-2cqw;top:50%;transform:translateY(-50%);width:50cqw;
 filter:drop-shadow(0 0 1.6cqw rgba(190,230,240,.14));
 -webkit-mask-image:linear-gradient(100deg,transparent 3%,#000 34%);mask-image:linear-gradient(100deg,transparent 3%,#000 34%)}
/* C: big crop, bottom-right */
.vc svg.map{right:-13cqw;top:56%;transform:translateY(-50%);width:64cqw;
 filter:drop-shadow(0 0 2.4cqw rgba(255,255,255,.10))}
/* D: centred watermark */
.vd svg.map{left:50%;top:54%;transform:translate(-50%,-50%);width:74cqw}
</style>
</head>
<body>
<h3>Option A — District colours</h3>
<h3 style="position:absolute;visibility:hidden">x</h3>
<div class="grid" id="grid"></div>
<script>
/*MAPD*/
const PAL={'North':'#9AA3B1','East':'#F5A623','Central':'#5CC8E0','South':'#C2A4D6','West':'#3ECF8E','Central Coast':'#E58FA8'};
const ORDER=['North','East','Central','South','West','Central Coast'];
const ROWS=[['North District','9 LGAs'],['East District','9 LGAs'],['Central District','4 LGAs'],
 ['South District','3 LGAs'],['West District','8 LGAs'],['Central Coast','1 LGA']];
function txt(){
 return '<div class="pad"><h1>Greater Sydney breakdown</h1><p class="sub">Research Report</p>'
  +ROWS.map((r,i)=>'<div class="drow"><i style="background:'+PAL[ORDER[i]]+'"></i>'+r[0]+'<em>'+r[1]+'</em></div>').join('')
  +'</div>';
}
function svgMap(pathFn){
 return '<svg class="map" viewBox="0 0 '+MAPD.w+' '+MAPD.h+'" aria-hidden="true">'
  +ORDER.map(pathFn).join('')+'</svg>';
}
const V=[
 ['va','A — District colours · each district faintly in its own colour, left edge fades out',
  d=>'<path d="'+MAPD.paths[d]+'" fill="'+PAL[d]+'" fill-opacity=".12" stroke="'+PAL[d]+'" stroke-opacity=".45" stroke-width="1.3" stroke-linejoin="round"/>'],
 ['vb','B — Etched line-work · no fill, fine glowing white boundary lines only',
  d=>'<path d="'+MAPD.paths[d]+'" fill="none" stroke="#DCE9EE" stroke-opacity=".34" stroke-width="1.1" stroke-linejoin="round"/>'],
 ['vc','C — Big crop · larger, brighter silhouette running off the bottom-right corner',
  d=>'<path d="'+MAPD.paths[d]+'" fill="#FFFFFF" fill-opacity=".075" stroke="#FFFFFF" stroke-opacity=".22" stroke-width="1.5" stroke-linejoin="round"/>'],
 ['vd','D — Centred watermark · huge and whisper-faint behind everything',
  d=>'<path d="'+MAPD.paths[d]+'" fill="#FFFFFF" fill-opacity=".035" stroke="#FFFFFF" stroke-opacity=".10" stroke-width="1.6" stroke-linejoin="round"/>'],
];
document.getElementById('grid').innerHTML=V.map(v=>
 '<div class="sl '+v[0]+'"><div class="tag">'+v[1]+'</div>'+svgMap(v[2])+txt()+'</div>').join('');
document.querySelector('h3').textContent='Cover options - pick one (or mix: e.g. "B but bigger")';
</script>
</body>
</html>
