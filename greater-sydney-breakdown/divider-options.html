<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Divider options</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;background:#0A1014;font-family:Montserrat,-apple-system,Segoe UI,Roboto,sans-serif;color:#E8EEF2;padding:18px}
h3{margin:4px 0 14px;font-size:15px;letter-spacing:.08em;text-transform:uppercase;color:#8FA9B4}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:22px}
.sl{position:relative;aspect-ratio:16/9;border-radius:10px;overflow:hidden;container-type:inline-size;
 background:radial-gradient(115% 85% at 12% 14%,#1E525E 0%,#16303A 48%,#0F1A20 100%)}
.tag{position:absolute;left:0;top:0;background:#0A1014C0;color:#CFE3EA;font-size:12px;font-weight:700;
 padding:6px 12px;border-radius:0 0 10px 0;letter-spacing:.06em;z-index:5}
.pad{position:absolute;inset:0;padding:6cqw 4cqw;display:flex;flex-direction:column;justify-content:center}
.dvt{font-size:7cqw;font-weight:800;letter-spacing:.04em;margin:0;color:#F4F7F9;line-height:1.05;text-transform:uppercase}
.dvrule{width:6.4cqw;height:.32cqw;border-radius:.16cqw;background:#7FB7C4;margin:1.7cqw 0 2.2cqw}
.dvl{list-style:none;margin:0;padding:0;columns:2;column-gap:4.5cqw;max-width:72cqw}
.dvl li{font-size:1.22cqw;color:#C6D2DC;line-height:2.05;break-inside:avoid}
.dvl li::before{content:'';display:inline-block;width:.5cqw;height:.5cqw;background:#7FB7C4;border-radius:.12cqw;margin-right:.85cqw;vertical-align:.08cqw}
svg.map{position:absolute;pointer-events:none}
/* A: ghost numeral */
.va .num{position:absolute;right:-2cqw;top:46%;transform:translateY(-50%);font-size:34cqw;font-weight:800;
 color:#FFFFFF;opacity:.05;line-height:1;letter-spacing:-.04em}
/* B: map watermark echo */
.vb svg.map{right:-13cqw;top:52%;transform:translateY(-50%);width:70cqw}
/* C: centred monumental */
.vc .pad{align-items:center;text-align:center}
.vc .dvrule{margin-left:auto;margin-right:auto}
.vc .chips{display:flex;gap:.9cqw;margin:0 0 2.2cqw}
.vc .chips i{width:1.5cqw;height:.5cqw;border-radius:.25cqw;display:block}
.vc .dvl{columns:2;text-align:left}
/* D: split with vertical hairline */
.vd .pad{flex-direction:row;align-items:center;gap:4cqw;justify-content:flex-start}
.vd .left{flex:0 0 34cqw}
.vd .divline{width:.14cqw;align-self:stretch;margin:6cqw 0;background:linear-gradient(180deg,transparent,#7FB7C4AA 30%,#7FB7C4AA 70%,transparent)}
.vd .dvl{columns:1;max-width:none;flex:1}
.vd .dvt{font-size:5.6cqw}
.vd .kick{font-size:1.15cqw;font-weight:700;letter-spacing:.3em;color:#7FB7C4;text-transform:uppercase;margin:0 0 1cqw}
</style>
</head>
<body>
<h3>Divider options - Supply &amp; Demand shown as the sample. Pick one or mix.</h3>
<div class="grid" id="grid"></div>
<script>
/*MAPD*/
const ORDER=['North','East','Central','South','West','Central Coast'];
const PAL={'North':'#9AA3B1','East':'#F5A623','Central':'#5CC8E0','South':'#C2A4D6','West':'#3ECF8E','Central Coast':'#E58FA8'};
const ITEMS=['Demand score','Vacancy rate projection','Vacancy rate v rent (Houses)','Vacancy rate v rent (Units)',
 'Stock v days on market (Houses)','Stock v days on market (Units)','Dwelling sales','Change in population',
 'Population movement','Approvals v population change','New households v housing'];
const ul=cls=>'<ul class="dvl'+(cls?' '+cls:'')+'">'+ITEMS.map(t=>'<li>'+t+'</li>').join('')+'</ul>';
const mapSil='<svg class="map" viewBox="0 0 '+MAPD.w+' '+MAPD.h+'" aria-hidden="true">'
 +'<defs><mask id="dvmask"><rect width="'+MAPD.w+'" height="'+MAPD.h+'" fill="#FFF"/>'
 +'<g fill="none" stroke="#000" stroke-width="3.2">'+ORDER.map(d=>'<path d="'+MAPD.paths[d]+'"/>').join('')+'</g></mask></defs>'
 +'<g mask="url(#dvmask)">'+ORDER.map(d=>'<path d="'+MAPD.paths[d]+'" fill="#FFF" fill-opacity=".04"/>').join('')+'</g></svg>';
const V=[
 ['va','A - Ghost numeral: huge faded section number behind the right side',
  '<div class="num">01</div><div class="pad"><h2 class="dvt">Supply &amp; Demand</h2><div class="dvrule"></div>'+ul()+'</div>'],
 ['vb','B - Map watermark: the cover’s faded map echoed behind every divider',
  mapSil+'<div class="pad"><h2 class="dvt">Supply &amp; Demand</h2><div class="dvrule"></div>'+ul()+'</div>'],
 ['vc','C - Centred: symmetric layout with the six district colours as a motif',
  '<div class="pad"><h2 class="dvt">Supply &amp; Demand</h2><div class="dvrule"></div>'
   +'<div class="chips">'+ORDER.map(d=>'<i style="background:'+PAL[d]+'"></i>').join('')+'</div>'+ul()+'</div>'],
 ['vd','D - Split: title left, contents right of a soft vertical hairline, single column',
  '<div class="pad"><div class="left"><p class="kick">Pillar 01</p><h2 class="dvt">Supply &amp; Demand</h2>'
   +'<div class="dvrule"></div></div><div class="divline"></div>'+ul()+'</div>'],
];
document.getElementById('grid').innerHTML=V.map(v=>'<div class="sl '+v[0]+'"><div class="tag">'+v[1]+'</div>'+v[2]+'</div>').join('');
</script>
</body>
</html>
