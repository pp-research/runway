<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Traffic lights — design options</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;background:#0A1014;font-family:Montserrat,-apple-system,Segoe UI,Roboto,sans-serif;color:#E8EEF2;padding:18px}
h3{margin:4px 0 14px;font-size:15px;letter-spacing:.08em;text-transform:uppercase;color:#8FA9B4}
.grid{display:grid;grid-template-columns:1fr;gap:22px;max-width:1200px}
.sl{position:relative;aspect-ratio:16/9;border-radius:10px;overflow:hidden;container-type:inline-size;background:#132028}
.tag{position:absolute;left:0;top:0;background:#0A1014D0;color:#CFE3EA;font-size:12px;font-weight:700;
 padding:6px 12px;border-radius:0 0 10px 0;letter-spacing:.06em;z-index:9}
.pad{position:absolute;inset:0;padding:4.6cqw 3.2cqw 2cqw;display:flex;flex-direction:column}
.pt{font-size:2.1cqw;font-weight:700;margin:0 0 1cqw;letter-spacing:-.02em}
/* ============ A: dark luxe grid ============ */
.vA .wrap{display:flex;gap:2.4cqw;flex:1;min-height:0}
.vA table{border-collapse:collapse;flex:1;height:min-content}
.vA .sec td{padding:.9cqw 0 .25cqw;font-size:.66cqw;letter-spacing:.22em;color:#7FB7C4;text-transform:uppercase;font-weight:700}
.vA td{padding:.34cqw .5cqw;font-size:.88cqw;color:#AAB6C2;border-bottom:1px solid #FFFFFF0D}
.vA td.c{text-align:center}
.vA th{font-size:.62cqw;letter-spacing:.06em;color:#fff;text-transform:uppercase;padding:.3cqw .5cqw;font-weight:700}
.vA th span{display:block;padding:.24cqw 0;border-radius:.26cqw}
.vA .dot{display:inline-block;width:.85cqw;height:.85cqw;border-radius:50%;box-shadow:0 0 .55cqw var(--g)}
.vA .mapcard{flex:0 0 24cqw;background:#FFFFFF08;border:1px solid #FFFFFF12;border-radius:.7cqw;padding:1cqw;display:flex;flex-direction:column}
.vA .mapcard h4{margin:.8cqw 0 .4cqw;font-size:.72cqw;letter-spacing:.2em;color:#7FB7C4;text-transform:uppercase}
.vA .srow{display:flex;align-items:center;gap:.55cqw;font-size:.86cqw;color:#DCE5EA;padding:.28cqw 0;border-bottom:1px solid #FFFFFF0D}
.vA .srow i{width:.65cqw;height:.65cqw;border-radius:.14cqw}
.vA .srow .rks{margin-left:auto;display:flex;gap:.3cqw}
.vA .rk{width:1.15cqw;height:1.15cqw;border-radius:50%;display:flex;align-items:center;justify-content:center;
 font-size:.62cqw;font-weight:800;color:#0E1720}
/* ============ B: scorecard tiles ============ */
.vB .tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:1cqw;flex:1}
.vB .t{background:#FFFFFF0A;border:1px solid #FFFFFF14;border-top:.35cqw solid;border-radius:.65cqw;padding:1cqw 1.1cqw;display:flex;flex-direction:column}
.vB .nm{font-size:1.2cqw;font-weight:700;margin-bottom:.6cqw}
.vB .pills{display:flex;gap:.9cqw;margin:.2cqw 0 .7cqw}
.vB .pil{flex:1;background:#0E171F66;border:1px solid #FFFFFF10;border-radius:.5cqw;padding:.55cqw .4cqw;text-align:center}
.vB .pil b{display:block;font-size:.6cqw;letter-spacing:.16em;color:#8FA9B4;margin-bottom:.4cqw}
.vB .big{display:block;width:1.7cqw;height:1.7cqw;border-radius:50%;margin:0 auto;box-shadow:0 0 .8cqw var(--g);position:relative}
.vB .big em{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-style:normal;
 font-size:.72cqw;font-weight:800;color:#0E1720}
.vB .segs{font-size:.7cqw;color:#9DB0BB;display:flex;justify-content:space-between}
.vB .segs i{display:inline-block;width:.55cqw;height:.55cqw;border-radius:50%;margin-left:.25cqw;vertical-align:-.05cqw}
/* ============ C: refined light ============ */
.vC .panel{background:#FDFEFE;border-radius:.7cqw;flex:1;display:flex;gap:2cqw;padding:1.3cqw 1.5cqw;color:#22303B}
.vC table{border-collapse:collapse;flex:1;height:min-content}
.vC .sec td{padding:.8cqw 0 .2cqw;font-size:.62cqw;letter-spacing:.22em;color:#7C8A94;text-transform:uppercase;font-weight:700}
.vC td{padding:.3cqw .5cqw;font-size:.85cqw;color:#4A5866;border-bottom:1px solid #EDF1F3}
.vC td.c{text-align:center}
.vC th{font-size:.68cqw;color:#22303B;padding:.3cqw .5cqw .45cqw;font-weight:700;border-bottom:.22cqw solid}
.vC .dot{display:inline-block;width:.7cqw;height:.7cqw;border-radius:50%;outline:.16cqw solid #FFFFFF;box-shadow:0 0 0 .3cqw var(--r)}
.vC .maphalf{flex:0 0 26cqw}
.vC h4{margin:.9cqw 0 .3cqw;font-size:.68cqw;letter-spacing:.2em;color:#7C8A94;text-transform:uppercase}
.vC .srow{display:flex;align-items:center;gap:.5cqw;font-size:.85cqw;color:#22303B;padding:.26cqw 0;border-bottom:1px solid #EDF1F3}
.vC .srow i{width:.6cqw;height:.6cqw;border-radius:.13cqw}
.vC .srow .rks{margin-left:auto;display:flex;gap:.28cqw}
.vC .rk{width:1.1cqw;height:1.1cqw;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.6cqw;font-weight:800;color:#fff}
svg.mmap{width:100%;height:auto}
</style>
</head>

 ['S&D',null],['Demand score · houses',[O,G,O,G,O,O]],['Demand score · units',[G,G,G,G,G,G]],

function mapSvg(fillOp,stroke){
 return '<svg class="mmap" viewBox="0 0 '+MAPD.w+' '+MAPD.h+'">'+ORDER.map(d=>
  '<path d="'+MAPD.paths[d]+'" fill="'+PAL[d]+'" fill-opacity="'+fillOp+'" stroke="'+stroke+'" stroke-width="2.4"/>').join('')+'</svg>';
}
function tableRows(cls){
 return ROWS.map(r=>r[1]===null
  ?'<tr class="sec"><td colspan="7">'+r[0]+'</td></tr>'
  :'<tr><td>'+r[0]+'</td>'+r[1].map(c=>'<td class="c"><span class="dot" style="background:'+c+';--g:'+c+'66;--r:'+c+'33"></span></td>').join('')+'</tr>').join('');
}
function mockA(){
 return '<div class="pad"><h2 class="pt">Traffic lights</h2><div class="wrap">'
  +'<table><thead><tr><th></th>'+ORDER.map(d=>'<th><span style="background:'+HDL[d]+'">'+(d==='Central Coast'?'C. COAST':d)+'</span></th>').join('')+'</tr></thead>'

  +'<div class="mapcard">'+mapSvg('.85','#0F1A20')
  +'<h4>District summary</h4>'
  +ORDER.map((d,i)=>'<div class="srow"><i style="background:'+PAL[d]+'"></i>'+d

  +'</div></div></div>';
}
function mockB(){

    +'</div>'}).join('')

}
function mockC(){

  +'<table><thead><tr><th></th>'+ORDER.map(d=>'<th style="border-bottom-color:'+PAL[d]+';color:'+HDL[d]+'">'+(d==='Central Coast'?'C. Coast':d)+'</th>').join('')+'</tr></thead>'

  +'</div></div></div>';
}
